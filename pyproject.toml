[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volscan"
version = "0.2.0"
description = "VolScan: volcanic hazard twin (lava flow ensembles, seismic unrest, observation assimilation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "requests>=2.28", "pillow>=9"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.25"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
data = ["tifffile>=2023.1", "imagecodecs>=2023.1"]

[tool.setuptools.packages.find]
include = ["volscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
